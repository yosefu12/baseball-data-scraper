name: Baseball Data Scraper

on:
  schedule:
    - cron: '23 20 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml selenium webdriver-manager

      - name: Run Python Script
        env:
          FANGRAPHS_COOKIE: ${{ secrets.FANGRAPHS_COOKIE }}
        run: python baseball_project_data_fetcher.py

      - name: Commit and Push changes
        # always() so that when one source fails, the sources that DID work
        # are still committed. The run is still reported as failed overall.
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global rebase.autoStash true 
          # -A (not data/*.csv) so that REMOVED files are staged too. Without this a
          # source that stops being downloaded keeps its old CSV in the repo forever
          # and Excel silently loads stale data.
          git add -A data/
          git commit -m "Automated data refresh" || echo "No changes to commit"
          git pull --rebase -X theirs
          git push
